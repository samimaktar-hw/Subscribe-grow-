<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEXCA WEB | SECURE LINK LOCKER</title>
    
    <!-- Fonts & Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #39ff72;
            --primary-glow: rgba(57, 255, 114, 0.5);
            --bg-dark: #020303;
            --panel-bg: rgba(2, 10, 5, 0.85);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: #eaffea;
            font-family: 'Share Tech Mono', monospace;
            min-height: 100vh;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Matrix Scanline Background */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: linear-gradient(rgba(0, 255, 80, 0.03) 50%, transparent 50%);
            background-size: 100% 4px;
            pointer-events: none;
            z-index: -1;
        }

        /* =========================================
           MAIN APP CONTAINER (Direct Open)
        ========================================= */
        #app-container {
            display: block; /* Direct open, no loader */
            width: min(92%, 600px);
            margin: 40px auto;
            position: relative;
            z-index: 10;
            flex: 1;
        }

        header.app-header {
            text-align: center;
            margin-bottom: 30px;
        }

        header.app-header img {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            box-shadow: 0 0 20px var(--primary);
            border: 2px solid var(--primary);
            margin-bottom: 15px;
            object-fit: cover;
        }

        .cyber-card {
            background: var(--panel-bg);
            border: 1px solid var(--primary);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 0 20px rgba(57, 255, 114, 0.2);
            display: none;
        }

        .card-title {
            font-family: 'Orbitron', sans-serif;
            color: var(--primary);
            text-align: center;
            font-size: 18px;
            border-bottom: 1px solid rgba(57, 255, 114, 0.3);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .form-group { margin-bottom: 15px; }
        
        .form-label {
            display: block;
            color: #86efac;
            font-size: 13px;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .cyber-input, .cyber-select {
            width: 100%;
            background: #020a04;
            border: 1px solid var(--primary);
            border-radius: 8px;
            color: #fff;
            padding: 12px;
            font-family: 'Share Tech Mono', monospace;
            outline: none;
        }
        
        .cyber-input:focus, .cyber-select:focus {
            box-shadow: 0 0 10px var(--primary-glow);
            border-color: #fff;
        }

        .task-row {
            background: rgba(57, 255, 114, 0.05);
            padding: 15px;
            border-radius: 8px;
            border: 1px dashed rgba(57, 255, 114, 0.3);
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .task-row-top {
            display: flex;
            gap: 10px;
            width: 100%;
        }

        .btn-cyber {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: #000;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            font-size: 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: 0.3s;
            margin-top: 10px;
        }

        .btn-cyber:hover:not(:disabled) {
            background: #fff;
            box-shadow: 0 0 20px var(--primary);
        }

        .btn-cyber:disabled {
            background: #1e3a24;
            color: #4b6351;
            cursor: not-allowed;
        }

        .btn-outline {
            background: transparent;
            color: var(--primary);
            border: 1px solid var(--primary);
        }
        .btn-outline:hover {
            background: var(--primary);
            color: #000;
        }

        .remove-btn {
            background: #ff3333;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 0 15px;
            cursor: pointer;
            font-size: 16px;
        }

        /* Visitor Tasks */
        .visitor-task-btn {
            background: #061a0b;
            color: var(--primary);
            border: 1px solid var(--primary);
            justify-content: flex-start;
            padding: 15px;
            font-family: 'Share Tech Mono', monospace;
        }
        .visitor-task-btn i { font-size: 20px; width: 30px; }
        
        .visitor-task-btn.completed {
            background: #008033;
            color: #fff;
            border-color: #fff;
            cursor: default;
        }

        .progress-bg {
            height: 12px;
            background: #011205;
            border: 1px solid var(--primary);
            border-radius: 6px;
            margin: 20px 0;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: var(--primary);
            transition: 0.5s ease;
            box-shadow: 0 0 10px var(--primary);
        }

        #result-box {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: #010803;
            border: 1px dashed var(--primary);
            border-radius: 8px;
            word-break: break-all;
            color: #a3f7ba;
            text-align: center;
        }

        footer {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #4ade80;
            border-top: 1px solid rgba(0, 255, 102, 0.2);
            width: 100%;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <!-- ==========================================
         MAIN APP INTERFACE
    =========================================== -->
    <div id="app-container">
        
        <header class="app-header">
            <!-- আপনার লোগো -->
            <img src="logo.png" alt="Logo" id="header-logo" onerror="this.src='https://sub4unlock.com/assets/img/512.png'">
            <h2 style="color:#fff; font-family:'Orbitron', sans-serif;">HEXCA <span style="color:var(--primary)">WEB</span></h2>
        </header>

        <!-- ADMIN GENERATOR PANEL -->
        <div class="cyber-card" id="generator-panel">
            <div class="card-title"><i class="fa-solid fa-code"></i> CREATE LOCKED LINK</div>

            <div id="tasks-container">
                <!-- Task rows will be added here dynamically -->
            </div>

            <button class="btn-cyber btn-outline" onclick="addTaskRow()">
                <i class="fa-solid fa-plus"></i> ADD ANOTHER TASK
            </button>

            <div class="form-group" style="margin-top: 25px;">
                <label class="form-label"><i class="fa-solid fa-link"></i> Final Destination Link (To Unlock):</label>
                <input type="url" id="final-url" class="cyber-input" placeholder="https://example.com/your-file" required>
            </div>

            <button class="btn-cyber" id="generate-btn">
                <i class="fa-solid fa-lock"></i> GENERATE SECURE LINK
            </button>

            <div id="result-box">
                <p style="margin-bottom:10px; color:#fff;">Your Shareable Link:</p>
                <div id="generated-link" style="margin-bottom: 15px; font-size: 14px;"></div>
                <button class="btn-cyber" id="copy-btn">
                    <i class="fa-solid fa-copy"></i> COPY LINK
                </button>
            </div>
        </div>

        <!-- VISITOR UNLOCK PANEL -->
        <div class="cyber-card" id="visitor-panel">
            <div class="card-title"><i class="fa-solid fa-shield-halved"></i> COMPLETE STEPS TO UNLOCK</div>
            
            <p style="font-size: 13px; color:#a3f7ba; text-align:center; margin-bottom: 20px;">
                You must complete all the required tasks below to decrypt the destination link.
            </p>

            <div id="visitor-tasks-container">
                <!-- Buttons will be generated here -->
            </div>

            <div style="display:flex; justify-content:space-between; font-size:12px; margin-top:20px;">
                <span>PROGRESS:</span>
                <span id="progress-text">0/0 COMPLETED</span>
            </div>
            
            <div class="progress-bg">
                <div class="progress-fill" id="progress-bar"></div>
            </div>

            <button class="btn-cyber" id="unlock-btn" disabled>
                <i class="fa-solid fa-lock" id="unlock-icon"></i> UNLOCK LINK
            </button>
        </div>

    </div>

    <footer>
        &copy; 2026 HEXCAWEB.COM • SECURE LINK LOCKER ARCHITECTURE
    </footer>

    <!-- ==========================================
         FIREBASE & LOGIC SCRIPT
    =========================================== -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // Your Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyACNPX-49A2wfXS85SFtk8VZVDrUxxCc-I",
            authDomain: "subscribe-grow-594e7.firebaseapp.com",
            databaseURL: "https://subscribe-grow-594e7-default-rtdb.firebaseio.com",
            projectId: "subscribe-grow-594e7",
            storageBucket: "subscribe-grow-594e7.firebasestorage.app",
            messagingSenderId: "237430351893",
            appId: "1:237430351893:web:e48e41ddffc4306007c61c"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // UI Elements
        const generatorPanel = document.getElementById('generator-panel');
        const visitorPanel = document.getElementById('visitor-panel');
        const tasksContainer = document.getElementById('tasks-container');

        // Platform Templates
        const platforms = {
            youtube: { name: "YouTube Subscribe", icon: "fa-brands fa-youtube" },
            facebook: { name: "Facebook Follow", icon: "fa-brands fa-facebook" },
            instagram: { name: "Instagram Follow", icon: "fa-brands fa-instagram" },
            telegram: { name: "Join Telegram", icon: "fa-brands fa-telegram" },
            custom: { name: "Custom Link", icon: "fa-solid fa-link" }
        };

        // Add Dynamic Task Row in Generator
        window.addTaskRow = function() {
            const row = document.createElement('div');
            row.className = 'task-row';
            
            let optionsHTML = '';
            for (let key in platforms) {
                optionsHTML += `<option value="${key}">${platforms[key].name}</option>`;
            }

            // Custom Text Input Option Added Here
            row.innerHTML = `
                <div class="task-row-top">
                    <select class="cyber-select task-platform" style="flex: 1;" onchange="toggleCustomText(this)">
                        ${optionsHTML}
                    </select>
                    <button class="remove-btn" onclick="this.parentElement.parentElement.remove()"><i class="fa-solid fa-trash"></i></button>
                </div>
                <!-- This input shows only if Custom Link is selected -->
                <input type="text" class="cyber-input custom-label" placeholder="Write your own text (e.g., Like Video)" style="display: none;">
                <input type="url" class="cyber-input task-url" placeholder="Paste URL here..." required>
            `;
            tasksContainer.appendChild(row);
        }

        // Toggle Custom Text Input
        window.toggleCustomText = function(selectElement) {
            const customInput = selectElement.parentElement.parentElement.querySelector('.custom-label');
            if (selectElement.value === 'custom') {
                customInput.style.display = 'block';
                customInput.required = true;
            } else {
                customInput.style.display = 'none';
                customInput.required = false;
            }
        }

        // Initialize with one empty task
        addTaskRow();

        // Mode Checker (Directly runs when page loads)
        async function checkUrlMode() {
            const urlParams = new URLSearchParams(window.location.search);
            const linkId = urlParams.get('id');

            if (linkId) {
                // VISITOR MODE
                visitorPanel.style.display = 'block';
                await loadVisitorTasks(linkId);
            } else {
                // GENERATOR MODE
                generatorPanel.style.display = 'block';
            }
        }

        checkUrlMode();

        // ==========================================
        // GENERATOR LOGIC
        // ==========================================
        document.getElementById('generate-btn').addEventListener('click', async () => {
            const finalUrl = document.getElementById('final-url').value.trim();
            const taskElements = document.querySelectorAll('.task-row');
            const btn = document.getElementById('generate-btn');

            let tasksList = [];
            let isValid = true;

            taskElements.forEach(row => {
                const platform = row.querySelector('.task-platform').value;
                const url = row.querySelector('.task-url').value.trim();
                const customText = row.querySelector('.custom-label').value.trim();
                
                if(!url) isValid = false;
                if(platform === 'custom' && !customText) isValid = false;

                tasksList.push({ 
                    platform: platform, 
                    url: url, 
                    customLabel: customText 
                });
            });

            if (!finalUrl || !isValid || tasksList.length === 0) {
                alert("TERMINAL ERROR: Please fill all URL fields properly. If 'Custom Link' is selected, you must type a name.");
                return;
            }

            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> GENERATING IN DATABASE...';
            btn.disabled = true;

            try {
                const docRef = await addDoc(collection(db, "locked_links"), {
                    targetUrl: finalUrl,
                    tasks: tasksList,
                    createdAt: new Date().toISOString()
                });

                const shareableLink = `${window.location.origin}${window.location.pathname}?id=${docRef.id}`;
                document.getElementById('generated-link').innerText = shareableLink;
                document.getElementById('result-box').style.display = 'block';
                
                btn.innerHTML = '<i class="fa-solid fa-check"></i> LINK CREATED SUCCESSFULLY';
                btn.style.background = "#fff";
            } catch (error) {
                // Advanced Error Notification
                console.error("Firebase Error: ", error);
                alert("⚠️ LINK GENERATION FAILED!\n\nREASON: " + error.message + "\n\nSOLUTION: Go to your Firebase Console -> Firestore Database -> Click 'Create Database' -> Set Rules to 'allow read, write: if true;'");
                btn.innerHTML = '<i class="fa-solid fa-lock"></i> GENERATE SECURE LINK';
                btn.disabled = false;
            }
        });

        document.getElementById('copy-btn').addEventListener('click', () => {
            const text = document.getElementById('generated-link').innerText;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById('copy-btn');
                btn.innerHTML = '<i class="fa-solid fa-check"></i> COPIED!';
                setTimeout(() => { btn.innerHTML = '<i class="fa-solid fa-copy"></i> COPY LINK'; }, 2000);
            });
        });


        // ==========================================
        // VISITOR LOGIC
        // ==========================================
        let visitorData = null;
        let completedTasksCount = 0;

        async function loadVisitorTasks(linkId) {
            try {
                const docRef = doc(db, "locked_links", linkId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    visitorData = docSnap.data();
                    renderVisitorButtons(visitorData.tasks);
                } else {
                    alert("ERROR: This link is invalid or has been deleted.");
                    window.location.href = window.location.pathname;
                }
            } catch (error) {
                alert("SYSTEM ERROR: Failed to load tasks. Check your internet or Firebase Rules.");
            }
        }

        function renderVisitorButtons(tasks) {
            const container = document.getElementById('visitor-tasks-container');
            container.innerHTML = '';
            
            document.getElementById('progress-text').innerText = `0/${tasks.length} COMPLETED`;

            tasks.forEach((task, index) => {
                const platInfo = platforms[task.platform] || platforms['custom'];
                
                // If it's custom, use the customLabel typed by the user, otherwise use the default name
                const buttonText = (task.platform === 'custom' && task.customLabel) ? task.customLabel : platInfo.name;
                
                const btn = document.createElement('button');
                btn.className = 'btn-cyber visitor-task-btn';
                btn.innerHTML = `<i class="${platInfo.icon}"></i> <span class="btn-text">${buttonText}</span>`;
                
                btn.onclick = () => handleTaskClick(btn, task.url, tasks.length);
                container.appendChild(btn);
            });
        }

        window.handleTaskClick = function(btn, url, totalTasks) {
            if (btn.classList.contains('completed')) return;

            window.open(url, '_blank');
            const textSpan = btn.querySelector('.btn-text');
            
            textSpan.innerHTML = 'VERIFYING...';
            
            setTimeout(() => {
                btn.classList.add('completed');
                btn.innerHTML = `<i class="fa-solid fa-check"></i> <span>COMPLETED</span>`;
                
                completedTasksCount++;
                updateProgress(completedTasksCount, totalTasks);
            }, 5000); // 5 Seconds verify time
        }

        function updateProgress(completed, total) {
            document.getElementById('progress-text').innerText = `${completed}/${total} COMPLETED`;
            const percentage = (completed / total) * 100;
            document.getElementById('progress-bar').style.width = percentage + '%';

            if (completed === total) {
                const unlockBtn = document.getElementById('unlock-btn');
                unlockBtn.disabled = false;
                unlockBtn.style.background = "var(--primary)";
                unlockBtn.style.color = "#000";
                document.getElementById('unlock-icon').className = "fa-solid fa-unlock";
                
                unlockBtn.onclick = () => {
                    window.location.href = visitorData.targetUrl;
                };
            }
        }
    </script>
</body>
</html>
